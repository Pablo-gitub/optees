name: Build & Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write   # needed to create the GitHub Release

# ---------------------------------------------------------------------------
# Build job — runs in parallel on all three platforms
# ---------------------------------------------------------------------------
jobs:
  quality-gate:
    name: Test release commit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb libgl1-mesa-glx libegl1 \
            libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service,test]"

      - name: Validate release tag against application version
        shell: bash
        run: |
          APP_VERSION="$(PYTHONPATH=src python -c 'import optees; print(optees.__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${APP_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Release tag ${TAG_VERSION} does not match Optees ${APP_VERSION}." >&2
            exit 1
          fi

      - name: Run authoritative test suite
        run: xvfb-run -a python -m pytest -q

  build:
    name: Build · ${{ matrix.label }}
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux (AppImage)
            artifact: optees-linux-x86_64.AppImage

          - os: windows-latest
            label: Windows (x64)
            artifact: optees-windows-x64-setup.exe

          - os: macos-14
            label: macOS Apple Silicon
            artifact: optees-macos-arm64.dmg

    steps:
      # ── Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      # ── System libraries needed by Qt on Linux ───────────────────────────
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgl1-mesa-glx libegl1 \
            libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0

      # ── Python dependencies ───────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service]"
          python -m pip install --requirement packaging/requirements-build.txt

      - name: Report packaging toolchain
        run: |
          python -m PyInstaller --version
          python -c "import _pyinstaller_hooks_contrib; print(_pyinstaller_hooks_contrib.__version__)"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: python -m PyInstaller optees.spec --noconfirm

      - name: Smoke test packaged local service (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export OPTEES_LOCAL_SERVER_TOKEN="release-smoke-token-00000000000000000000000000000000"
          dist/optees/optees --local-server --port 18765 --log-level error &
          SERVER_PID=$!
          cleanup() {
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18765/health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18765/health
          curl --fail --silent \
            -H "Authorization: Bearer ${OPTEES_LOCAL_SERVER_TOKEN}" \
            http://127.0.0.1:18765/api/v1/capabilities >/dev/null

      - name: Smoke test packaged local service (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export OPTEES_LOCAL_SERVER_TOKEN="release-smoke-token-00000000000000000000000000000000"
          dist/optees.app/Contents/MacOS/optees \
            --local-server --port 18765 --log-level error &
          SERVER_PID=$!
          cleanup() {
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18765/health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18765/health
          curl --fail --silent \
            -H "Authorization: Bearer ${OPTEES_LOCAL_SERVER_TOKEN}" \
            http://127.0.0.1:18765/api/v1/capabilities >/dev/null

      - name: Smoke test packaged local service (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OPTEES_LOCAL_SERVER_TOKEN = 'release-smoke-token-00000000000000000000000000000000'
          $server = Start-Process `
            -FilePath 'dist\optees\optees.exe' `
            -ArgumentList '--local-server', '--port', '18765', '--log-level', 'error' `
            -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                Invoke-RestMethod 'http://127.0.0.1:18765/health' | Out-Null
                $healthy = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $healthy) {
              throw 'Packaged local service did not become healthy.'
            }
            $headers = @{ Authorization = "Bearer $env:OPTEES_LOCAL_SERVER_TOKEN" }
            Invoke-RestMethod `
              -Headers $headers `
              -Uri 'http://127.0.0.1:18765/api/v1/capabilities' | Out-Null
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Verify bundled OR-Tools libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libs = python -c "import ortools, pathlib; print(pathlib.Path(ortools.__file__).resolve().parent / '.libs')"
          $wheelLibraries = @(Get-ChildItem $libs -File)

          if (-not ($wheelLibraries.Name -contains 'ortools.dll')) {
            throw "ortools.dll is missing from the installed OR-Tools wheel at $libs"
          }

          foreach ($library in $wheelLibraries) {
            $shipped = Join-Path 'dist\optees\_internal' $library.Name
            if (-not (Test-Path $shipped -PathType Leaf)) {
              throw "The packaged application is missing $($library.Name)"
            }

            $sourceHash = (Get-FileHash $library.FullName -Algorithm SHA256).Hash
            $shippedHash = (Get-FileHash $shipped -Algorithm SHA256).Hash
            if ($sourceHash -ne $shippedHash) {
              throw "$($library.Name) was not copied from the installed OR-Tools wheel"
            }
          }

          Write-Host "Verified $($wheelLibraries.Count) OR-Tools wheel libraries."

      # ── Package: Linux → AppImage ─────────────────────────────────────────
      - name: Create AppDir (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p AppDir
          # Copy the entire PyInstaller onedir into AppDir
          cp -r dist/optees/. AppDir/

          # AppRun: entry point for AppImage runtime
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/optees" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # .desktop file (required by appimagetool)
          cat > AppDir/optees.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Optees
          Exec=optees
          Icon=optees
          Type=Application
          Categories=Science;Math;Education;
          Comment=Linear and combinatorial optimization solver
          DESKTOP

          # Application icon (must match Icon= value in .desktop)
          cp src/optees/assets/logo/dark/appicon_256.png AppDir/optees.png

      - name: Download appimagetool (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGETOOL_VERSION="1.9.1"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl --fail --location --show-error \
            --output appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool.AppImage" | sha256sum --check --strict
          chmod +x appimagetool.AppImage

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # APPIMAGE_EXTRACT_AND_RUN avoids needing FUSE on the CI runner
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool.AppImage AppDir optees-linux-x86_64.AppImage

      # ── Package: Windows → native installer + explicit portable ZIP ──────
      - name: Install pinned Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          choco install innosetup --version=6.7.1 --yes --no-progress
          --allow-downgrade

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import optees; print(optees.__version__)"
          $sourceDir = (Resolve-Path 'dist\optees').Path
          $outputDir = (Resolve-Path '.').Path
          iscc "/DAppVersion=$version" "/DSourceDir=$sourceDir" "/O$outputDir" `
            packaging\windows\optees.iss

          if (-not (Test-Path 'optees-windows-x64-setup.exe' -PathType Leaf)) {
            throw 'Inno Setup did not produce optees-windows-x64-setup.exe'
          }

      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\optees\* `
            -DestinationPath optees-windows-x64-portable.zip

      # ── macOS: Developer ID signing + notarization when secrets exist ─────
      # Apple Gatekeeper accepts apps distributed outside the Mac App Store only
      # when they are signed with a Developer ID certificate and notarized.
      # If the secrets below are absent, CI falls back to ad-hoc signing for
      # contributor/test builds; those builds still show the Gatekeeper warning.
      - name: Configure macOS signing mode
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -n "${MACOS_CERTIFICATE_BASE64}" &&
                -n "${MACOS_CERTIFICATE_PASSWORD}" &&
                -n "${APPLE_ID}" &&
                -n "${APPLE_TEAM_ID}" &&
                -n "${APPLE_APP_SPECIFIC_PASSWORD}" ]]; then
            echo "MACOS_NOTARIZE=true" >> "${GITHUB_ENV}"
          else
            echo "MACOS_NOTARIZE=false" >> "${GITHUB_ENV}"
          fi

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ "${MACOS_NOTARIZE}" != "true" ]]; then
            echo "Developer ID secrets not configured; using ad-hoc signing."
            exit 0
          fi

          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/optees-signing.keychain-db"
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-temporary-ci-keychain-password}"

          CERTIFICATE_PATH="${CERTIFICATE_PATH}" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          cert_path = Path(os.environ["CERTIFICATE_PATH"])
          cert_data = base64.b64decode(os.environ["MACOS_CERTIFICATE_BASE64"])
          cert_path.write_bytes(cert_data)
          PY
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          if [[ -z "${APPLE_SIGNING_IDENTITY}" ]]; then
            APPLE_SIGNING_IDENTITY="$(
              security find-identity -v -p codesigning "${KEYCHAIN_PATH}" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
              head -n 1
            )"
          fi

          if [[ -z "${APPLE_SIGNING_IDENTITY}" ]]; then
            echo "Could not find a Developer ID Application signing identity." >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "${GITHUB_ENV}"

      - name: Sign .app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "${MACOS_NOTARIZE}" == "true" ]]; then
            while IFS= read -r -d '' file_path; do
              if file "${file_path}" | grep -q "Mach-O"; then
                codesign --force \
                  --timestamp \
                  --options runtime \
                  --sign "${APPLE_SIGNING_IDENTITY}" \
                  "${file_path}"
              fi
            done < <(find dist/optees.app -type f -print0)

            codesign --force \
              --timestamp \
              --options runtime \
              --entitlements build/macos/entitlements.plist \
              --sign "${APPLE_SIGNING_IDENTITY}" \
              dist/optees.app

            codesign --verify --deep --strict --verbose=2 dist/optees.app
          else
            codesign --force --deep --sign - dist/optees.app
          fi

      - name: Notarize .app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ "${MACOS_NOTARIZE}" != "true" ]]; then
            echo "Skipping notarization for ad-hoc signed build."
            exit 0
          fi

          NOTARY_ZIP="${RUNNER_TEMP}/optees-notary.zip"
          ditto -c -k --keepParent dist/optees.app "${NOTARY_ZIP}"

          xcrun notarytool submit "${NOTARY_ZIP}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait

          xcrun stapler staple dist/optees.app
          xcrun stapler validate dist/optees.app
          spctl -a -vvv -t exec dist/optees.app

      # ── Package: macOS → DMG with Applications shortcut ───────────────────
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root

          # ditto preserves symlinks and resource forks inside the .app bundle.
          ditto dist/optees.app dmg-root/optees.app
          ln -s /Applications dmg-root/Applications

          hdiutil create \
            -volname "Optees" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            optees-macos-arm64.dmg

      # ── Upload artifact for the release job ───────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload Windows portable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optees-windows-x64-portable.zip
          path: optees-windows-x64-portable.zip

# ---------------------------------------------------------------------------
# Release job — runs after all builds succeed
# ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum optees-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "Optees ${{ github.ref_name }}"
          body: |
            ## Optees ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Notes |
            |---|---|---|
            | macOS 14+ (Apple Silicon) | `optees-macos-arm64.dmg` | Open DMG → drag `optees.app` to Applications |
            | Windows 10/11 (x64) | `optees-windows-x64-setup.exe` | Per-user installer; no administrator privileges required |
            | Windows 10/11 (x64, portable) | `optees-windows-x64-portable.zip` | Unzip and run `optees.exe`; no installation or automatic replacement |
            | Linux (x86_64) | `optees-linux-x86_64.AppImage` | See instructions below |

            ### macOS
            Open the DMG and drag `optees.app` to `Applications`.
            Official release artifacts are Developer ID signed and notarized
            when the repository has Apple signing secrets configured.
            Contributor/test builds without those secrets are ad-hoc signed and
            may still require **right-click `optees.app` → Open** on first launch.

            ### Windows
            Use `optees-windows-x64-setup.exe` for a normal per-user
            installation under Local AppData. The portable ZIP is intended for
            temporary or restricted environments and is not an installer.
            Windows Defender SmartScreen may warn about an unrecognised publisher.
            Click **More info → Run anyway**.

            ### Linux
            ```bash
            chmod +x optees-linux-x86_64.AppImage
            ./optees-linux-x86_64.AppImage
            ```
            FUSE is not required (extracted mode).
            If the app fails to start, install: `sudo apt install libgl1 libegl1`

          files: artifacts/*
          draft: false
          prerelease: >-
            ${{
              contains(github.ref_name, 'alpha') ||
              contains(github.ref_name, 'beta')  ||
              contains(github.ref_name, 'rc')
            }}
          generate_release_notes: false
