name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-distribution:
    name: Python distribution · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x86-64
          - os: windows-latest
            label: Windows x64
          - os: macos-14
            label: macOS arm64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and source distribution
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2"
          python -m build --wheel --sdist --outdir dist-python

      - name: Validate artifacts and rebuild from source distribution
        run: >-
          python packaging/validate_python_distribution.py
          dist-python --rebuild-sdist

      - name: Exercise isolated installation profiles
        shell: bash
        run: |
          wheel=$(ls dist-python/optees-*.whl)
          python -m pip install "${wheel}"
          python packaging/smoke_python_distribution.py core
          for profile in local-service mcp desktop all; do
            environment=".venv-${profile}"
            python -m venv --system-site-packages "${environment}"
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              profile_python="${environment}/Scripts/python.exe"
            else
              profile_python="${environment}/bin/python"
            fi
            "${profile_python}" -m pip install "${wheel}[${profile}]"
            "${profile_python}" packaging/smoke_python_distribution.py "${profile}"
          done

  fast:
    name: Fast non-GUI tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1-mesa-glx libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service,test]"

      - name: Run fast test group
        run: >-
          python -m pytest -q
          -m "not gui and not benchmark and not tcp"

  gui:
    name: GUI tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb libgl1-mesa-glx libegl1 \
            libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service,test]"

      - name: Run GUI test group
        run: xvfb-run -a python -m pytest -q -m gui

  tcp:
    name: Loopback and subprocess tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1-mesa-glx libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service,test]"

      - name: Run TCP test group
        run: python -m pytest -q -m tcp

  benchmark:
    name: Scientific benchmark tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1-mesa-glx libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service,test]"

      - name: Prepare verified Maros-Meszaros QP corpus
        run: |
          python scripts/fetch_maros_meszaros_benchmark.py
          python scripts/fetch_maros_meszaros_benchmark.py --check-only

      - name: Run benchmark test group
        run: python -m pytest -q -m benchmark
