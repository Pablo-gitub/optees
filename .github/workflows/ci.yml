name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast non-GUI tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1-mesa-glx libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service,test]"

      - name: Run fast test group
        run: >-
          python -m pytest -q
          -m "not gui and not benchmark and not tcp"

  gui:
    name: GUI tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb libgl1-mesa-glx libegl1 \
            libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service,test]"

      - name: Run GUI test group
        run: xvfb-run -a python -m pytest -q -m gui

  tcp:
    name: Loopback and subprocess tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1-mesa-glx libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service,test]"

      - name: Run TCP test group
        run: python -m pytest -q -m tcp

  benchmark:
    name: Scientific benchmark tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1-mesa-glx libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot,local-service,test]"

      - name: Run benchmark test group
        run: python -m pytest -q -m benchmark
