[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optees"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "scipy",
    "markdown",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
