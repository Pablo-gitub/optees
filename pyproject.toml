[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optees"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2025.1.31",
    "PySide6",
    "numpy",
    "scipy>=1.16,<1.18",
    "ortools",
    "markdown",
]

[project.optional-dependencies]
plot = ["matplotlib"]
local-service = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
]
mcp = ["mcp>=1.27,<2"]
test = [
    "httpx>=0.28,<1",
    "mcp>=1.27,<2",
    "pytest>=8,<9",
    "pytest-qt>=4.5,<5",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
]

[project.gui-scripts]
optees = "optees.main:main"

[project.scripts]
optees-cli = "optees.cli:main"
optees-server = "optees.local_server:main"
optees-ollama-chat = "optees.ollama_chat:main"
optees-mcp = "optees.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "optees.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optees.assets" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gui: PySide6 presentation tests that may construct application windows",
    "benchmark: measured scientific or external benchmark integrations",
    "tcp: tests that open temporary loopback sockets or server processes",
    "timeout: hard wall-time supplied by pytest-timeout",
]
