[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optees"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy>=1.16,<1.18",
    "statsmodels>=0.14.6,<0.15",
    "ortools",
    "osqp>=0.6.3,<1",
]

[project.optional-dependencies]
plot = ["matplotlib"]
desktop = [
    "certifi>=2025.1.31",
    "markdown",
    "matplotlib",
    "PySide6",
]
local-service = [
    "fastapi>=0.115,<1",
    "matplotlib",
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
]
mcp = [
    "matplotlib",
    "mcp>=1.27,<2",
    "pydantic>=2.9,<3",
]
all = [
    "certifi>=2025.1.31",
    "fastapi>=0.115,<1",
    "markdown",
    "matplotlib",
    "mcp>=1.27,<2",
    "pydantic>=2.9,<3",
    "PySide6",
    "uvicorn>=0.34,<1",
]
test = [
    "certifi>=2025.1.31",
    "httpx>=0.28,<1",
    "markdown",
    "mcp>=1.27,<2",
    "PySide6",
    "pytest>=8,<9",
    "pytest-qt>=4.5,<5",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
]
dev = [
    "ruff>=0.15,<0.16",
]

[project.gui-scripts]
optees = "optees.main:main"

[project.scripts]
optees-cli = "optees.cli:main"
optees-server = "optees.local_server:main"
optees-ollama-chat = "optees.ollama_chat:main"
optees-mcp = "optees.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "optees.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optees.assets" = [
    "**/*.icns",
    "**/*.ico",
    "**/*.json",
    "**/*.md",
    "**/*.png",
    "**/*.svg",
    "**/*.typst",
]

[tool.setuptools.exclude-package-data]
"optees.assets" = ["__pycache__/*", "*/__pycache__/*", "*.pyc", "*/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gui: PySide6 presentation tests that may construct application windows",
    "benchmark: measured scientific or external benchmark integrations",
    "tcp: tests that open temporary loopback sockets or server processes",
    "timeout: hard wall-time supplied by pytest-timeout",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
