[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optees"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "numpy",
    "scipy",
    "ortools",
    "markdown",
]

[project.optional-dependencies]
plot = ["matplotlib"]
local-service = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
]

[project.gui-scripts]
optees = "optees.main:main"

[project.scripts]
optees-cli = "optees.cli:main"
optees-server = "optees.local_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "optees.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optees.assets" = ["**/*"]
